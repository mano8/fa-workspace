name: Cross-repo authorization conformance

# Workspace-owned (fa-workspace) cross-repository conformance gate for the
# Phase 5 conformance bullets — "local-package matrix + issuer/consumer parity"
# and "API-key principal conformance (§3.12)"
# (50-verification-conformance.md §6, TEST-CROSS-01; APIKEY-* in
# 30-api-key-introspection.md). It installs the local platform packages in
# dependency order (SDK -> fastapi) and runs the scripts/conformance harness.
# It is deliberately separate from workspace-policy-lint, which stays
# child-agnostic and installs no platform packages.
#
# fa-workspace is NOT a monorepo: every child is its own GitHub repository, so a
# fa-workspace checkout carries none of them. The harness needs the workspace
# *layout* (siblings beside the root), so each child is checked out into its own
# directory at the exact ref of the version matrix the harness declares in
# scripts/conformance/local_package_matrix.py. Keep the two in step.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match EXPECTED_*_VERSION in scripts/conformance/local_package_matrix.py.
  SDK_REF: v3.1.0
  FASTAPI_REF: v4.2.1
  # 2.0.0 is prepared but unpublished (no tag yet); it lives on the release
  # branch until the issuer's release leg tags it. Flip this to v2.0.0 then.
  ISSUER_REF: feat/auth-role-superuser-consistency
  RUFF_VERSION: 0.16.0

jobs:
  cross-repo-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      # The two platform packages are imported by the harness.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: mano8/auth-sdk-m8
          ref: ${{ env.SDK_REF }}
          path: auth-sdk-m8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: mano8/fastapi-m8
          ref: ${{ env.FASTAPI_REF }}
          path: fastapi-m8
          fetch-depth: 1
          persist-credentials: false
      # The issuer is a service: it is never imported, only read for its
      # declared version and dependency floors (ARCH-LAYER-DIRECTION).
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: mano8/fa-auth-m8
          ref: ${{ env.ISSUER_REF }}
          path: fa-auth-m8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install local platform packages in dependency order
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install "ruff==${RUFF_VERSION}"
          # SDK first so fastapi-m8 resolves the in-workspace SDK, not PyPI.
          # The db extra is required: auth_sdk_m8.controllers.base imports
          # sqlalchemy at module load, and fastapi_m8/__init__.py imports it.
          python -m pip install './auth-sdk-m8[security,fastapi,events,config,observability,db]'
          python -m pip install './fastapi-m8[db]'
      - name: Lint the conformance harness
        run: |
          python -m ruff check scripts/conformance
          python -m ruff format --check scripts/conformance
      - name: Run the conformance harness (matrix + parity + API-key principal)
        run: python -m scripts.conformance.run_conformance
      - name: Run the conformance unit tests
        run: python -m unittest discover -s scripts/conformance/tests -v
